<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<!-- NOTIFICATION BELL — fixed top right -->
<div class="notif-wrapper">
  <button class="notif-bell" id="notif-btn" title="Notifications">
    🔔
    <span class="notif-dot" id="notif-dot"></span>
  </button>
  <div class="notif-panel" id="notif-panel">
    <div class="notif-panel-header">Alerts</div>
    <div id="notif-list"><div class="notif-empty">No alerts</div></div>
  </div>
</div>

<div class="app-wrap">

  <!-- NAVBAR -->
  <nav class="navbar">
    <h1>💰 Expense Tracker</h1>
    <div class="navbar-right">
      <span id="user-email"></span>
      <button class="btn-icon" id="dark-btn" title="Toggle dark mode">🌙</button>
      <button class="btn-sm btn-export" id="export-btn">Export Excel</button>
      <button class="btn-sm" id="logout-btn">Log out</button>
    </div>
  </nav>

  <!-- SUMMARY CARDS -->
  <div class="summary">
    <div class="sum-card">
      <div class="sum-label">Balance</div>
      <div class="sum-value" id="sum-balance">$0.00</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">Income</div>
      <div class="sum-value income" id="sum-income">$0.00</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">Expenses</div>
      <div class="sum-value expense" id="sum-expense">$0.00</div>
    </div>
  </div>

  <!-- CHARTS -->
  <div class="charts-grid three">
    <div class="chart-card">
      <div class="chart-title">Expenses by Category</div>
      <div class="chart-wrap">
        <canvas id="pie-chart"></canvas>
        <div id="pie-empty" class="chart-empty" style="display:none">No expense data yet</div>
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Monthly Income vs Expenses</div>
      <div class="chart-wrap">
        <canvas id="bar-chart"></canvas>
        <div id="bar-empty" class="chart-empty" style="display:none">No data yet</div>
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Spending Trend</div>
      <div class="chart-wrap">
        <canvas id="line-chart"></canvas>
        <div id="line-empty" class="chart-empty" style="display:none">No data yet</div>
      </div>
    </div>
  </div>

  <!-- BUDGET GOALS -->
  <div class="section-card">
    <div class="section-header">
      <h2>Budget Goals <span class="section-sub">— this month</span></h2>
    </div>
    <form id="budget-form" class="budget-form-row">
      <select id="budget-cat" class="filter-select" style="flex:none;width:160px"></select>
      <input type="number" id="budget-amount" placeholder="Monthly limit ($)"
             min="1" step="1" class="filter-select" style="flex:none;width:180px" />
      <button class="btn-sm btn-export" type="submit">Set Budget</button>
    </form>
    <div id="budget-list" class="budget-list"></div>
  </div>

  <!-- ADD / EDIT FORM -->
  <div class="form-card" id="form-card">
    <h2 id="form-card-title">Add Transaction</h2>
    <form id="tx-form">
      <div class="form-row">
        <div class="field">
          <label>Type</label>
          <select id="tx-type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </div>
        <div class="field">
          <label>Category</label>
          <select id="tx-cat"></select>
        </div>
        <div class="field field-check">
          <label>&nbsp;</label>
          <label class="check-label">
            <input type="checkbox" id="tx-recurring" />
            Recurring monthly
          </label>
        </div>
      </div>
      <div class="form-row three">
        <div class="field">
          <label>Description</label>
          <input type="text" id="tx-desc" placeholder="e.g. Grocery run" required />
        </div>
        <div class="field">
          <label>Amount ($)</label>
          <input type="number" id="tx-amount" placeholder="0.00" min="0.01" step="0.01" required />
        </div>
        <div class="field">
          <label>Date</label>
          <input type="date" id="tx-date" required />
        </div>
      </div>
      <div class="form-actions">
        <button class="btn-primary" id="add-btn" type="submit">Add Transaction</button>
        <button class="btn-sm" id="cancel-edit-btn" type="button" style="display:none">Cancel</button>
      </div>
    </form>
  </div>

  <!-- FILTERS — Row 1: search | Row 2: dropdowns -->
  <div class="filter-card">
    <!-- Row 1: search input + search button -->
    <div class="filter-row-1">
      <input type="text" id="f-search"
             placeholder="Search by description…"
             class="filter-search-input" />
      <button class="btn-search" id="search-btn">Search</button>
    </div>

    <!-- Row 2: all dropdowns + date range + clear button -->
    <div class="filter-row-2">
      <select id="f-type" class="filter-select">
        <option value="all">All types</option>
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>
      <select id="f-cat" class="filter-select">
        <option value="all">All categories</option>
      </select>
      <select id="f-month" class="filter-select">
        <option value="all">All months</option>
        <option value="1">January</option><option value="2">February</option>
        <option value="3">March</option><option value="4">April</option>
        <option value="5">May</option><option value="6">June</option>
        <option value="7">July</option><option value="8">August</option>
        <option value="9">September</option><option value="10">October</option>
        <option value="11">November</option><option value="12">December</option>
      </select>
      <input type="date" id="f-from" class="filter-select" title="From date" />
      <input type="date" id="f-to"   class="filter-select" title="To date" />
      <button class="btn-sm" id="clear-filters-btn">Clear</button>
    </div>

    <div class="filter-count-row">
      <span id="filter-count" class="filter-count"></span>
    </div>
  </div>

  <!-- TRANSACTION LIST -->
  <div class="list-card">
    <div class="list-header">
      <span>Description</span>
      <span>Category</span>
      <span style="text-align:right">Amount</span>
      <span></span>
    </div>
    <div id="loading">Loading…</div>
    <div id="tx-list"></div>
  </div>

</div>

<script type="module" src="js/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
